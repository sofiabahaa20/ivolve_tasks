services:
  app:
    build: .
    image: sophiabahaaboshra/ivolve-app:latest
    container_name: ivolve-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: ivolve_user
      DB_PASSWORD: ivolve_pass
      DB_NAME: ivolve
    volumes:
      - app_logs:/app/logs
    networks:
      - ivolve-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: ivolve-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ivolve
      MYSQL_USER: ivolve_user
      MYSQL_PASSWORD: ivolve_pass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ivolve-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  ivolve-net:
    name: ivolve-net
    driver: bridge

volumes:
  db_data:
    name: db_data
  app_logs:
    name: app_logs
